    pubmed_count: 275
    sources: [PMID:39751968, PMID:32865373, PMID:39870096]

  - id: sma-risdiplam
    disease: "spinal muscular atrophy, type 1"
    expected_drug: "risdiplam"
    expected_target: SMN2
    kind: on_label
    note: >
      Si usa il sottotipo e non il termine padre: `spinal muscular atrophy`
      aggrega 34 geni causali di sottotipi diversi, e interrogarlo misurerebbe
      la capacita' di digerire un termine troppo ampio, non il metodo.
    pubmed_count: 358
    sources: [PMID:37569314, PMID:38267192, PMID:40802943]

  - id: hpp-asfotase
    disease: "hypophosphatasia"
    expected_drug: "asfotase alfa"
    expected_target: ALPL
    kind: on_label
    pubmed_count: 198
    sources: [PMID:30558909, PMID:40715944, PMID:37993691]

  - id: attr-tafamidis
    disease: "ATTRV30M amyloidosis"
    expected_drug: "tafamidis"
    expected_target: TTR
    kind: on_label
    pubmed_count: 2
    sources: [PMID:29993288, PMID:30675806]

  - id: cystinosis-cysteamine
    disease: "cystinosis"
    expected_drug: "cysteamine"
    expected_target: null
    kind: on_label
    note: >
      In DGIdb compare come CYSTEAMINE HYDROCHLORIDE. Altro caso in cui il
      confronto deve tollerare la forma salina.
    pubmed_count: 483
    sources: [PMID:40912033, PMID:36977426, PMID:7494397]

  # ---------------------------------------------------------------- fallimenti attesi
  - id: wilson-trientine
    disease: "Wilson disease"
    expected_drug: "trientine"
    expected_target: null
    kind: structural_miss
    note: >
      Chelante del rame. Non ha un bersaglio proteico: in DGIdb l'unica riga
      associata riporta gene NULL. Nessun metodo basato su pathway condivisi fra
      gene causale e bersaglio del farmaco puo' trovarlo, per costruzione.
      E' incluso apposta: un banco di prova in cui tutto e' trovabile premia la
      promiscuita', e alzare la copertura rendendo lo strumento indiscriminato
      sarebbe un peggioramento travestito da miglioramento.
    pubmed_count: 121
    sources: [PMID:28723019, PMID:20301685, PMID:31644190]

# --- Coppie escluse dopo la verifica, con il motivo -------------------------
# Elencarle serve a chi vorra' ampliare il banco: sono errori gia' commessi.
excluded:
  - pair: "hereditary transthyretin amyloidosis / tafamidis"
    reason: >
      La stringa non risolve nel subset mondo-rare. La malattia c'e', ma sotto
      il nome `ATTRV30M amyloidosis`: inclusa con quell'etichetta.
  - pair: "beta-thalassemia / luspatercept"
    reason: "Il nome della malattia e' ambiguo in Mondo e luspatercept non e' in DGIdb."
  - pair: "familial hypercholesterolemia / lomitapide"
    reason: >
      In DGIdb come LOMITAPIDE MESYLATE, ma senza un bersaglio genico
      utilizzabile dalla pipeline.
  - pair: "Duchenne muscular dystrophy / ataluren"
    reason: >
      I bersagli in DGIdb sono proteine ribosomiali (RPS4X, RPL27A e simili),
      coerenti con il meccanismo di readthrough ma non collegabili a DMD per
      appartenenza a un pathway. Sarebbe un secondo `structural_miss`: escluso
      per non sbilanciare il banco verso i fallimenti attesi.
