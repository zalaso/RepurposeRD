[project]
name = "RepurposeRD"
version = "0.1.0"
description = "Generatore di ipotesi di drug repurposing per malattie rare monogeniche, basato su pathway condivisi. 100% locale, solo dati aperti."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "RepurposeRD contributors" }]
keywords = ["drug-repurposing", "rare-disease", "bioinformatics", "knowledge-graph", "local-llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "httpx>=0.27",
    "duckdb>=1.0",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
repurposerd = "repurposerd.cli:app"

[project.urls]
Homepage = "https://github.com/zalaso/RepurposeRD"
Issues = "https://github.com/zalaso/RepurposeRD/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repurposerd"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# UP042: passare a StrEnum cambierebbe la serializzazione pydantic degli enum.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# B008: `typer.Option(...)` come default e' l'idioma di Typer, non un difetto.
"src/repurposerd/cli.py" = ["B008"]
# I campioni di file sorgente nei test riproducono righe reali: spezzarle li
# renderebbe meno fedeli al formato che devono documentare.
"tests/test_parsers.py" = ["E501", "RUF015"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
